# Paste this file into Zerops > Import a project.
# Choose EU Central (or your preferred region) and leave ZCP off for the trial.
# Deployment configuration lives in zerops.yaml in this repository.
# Source-checked configuration; not yet verified by a live Zerops deployment.
# Set OPENAI_API_KEY and TYPESAFE_API_KEY as secrets on uiagent after import.
# Set OIUI_AUTH_PASSWORD (12+ characters) as a secret on web.
# Stock agent checkpoints are in memory and do not survive restarts.
# Server-key mode requires HTTP Basic authentication; username defaults to admin.
project:
  name: openintelligentui
  corePackage: LIGHT

services:
  - hostname: uiagent
    type: python@3.12
    buildFromGit: https://github.com/mehtasunil2933-sketch/OpenIntelligentUI
    zeropsSetup: uiagent
    minContainers: 1
    maxContainers: 1
    verticalAutoscaling:
      minRam: 0.5
      maxRam: 2
      minFreeRamGB: 0.25
      minCpu: 1
      maxCpu: 2
      minDisk: 5

  - hostname: web
    type: nodejs@22
    buildFromGit: https://github.com/mehtasunil2933-sketch/OpenIntelligentUI
    zeropsSetup: web
    enableSubdomainAccess: true
    minContainers: 1
    maxContainers: 1
    verticalAutoscaling:
      minRam: 0.5
      maxRam: 2
      minFreeRamGB: 0.25
      minCpu: 1
      maxCpu: 2
      minDisk: 5
