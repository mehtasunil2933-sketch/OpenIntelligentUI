zerops:
  # Private Python agent. Set OPENAI_API_KEY and TYPESAFE_API_KEY as Zerops secrets.
  - setup: uiagent
    build:
      base: python@3.12
      os: ubuntu
      buildCommands:
        - python3 -m pip install --user uv
        - python3 -m uv export --project apps/agent --frozen --no-dev --no-emit-project --format requirements-txt --output-file requirements-agent.txt
        # Record and display the exact source commit included in this deployment.
        - git rev-parse HEAD > apps/agent/DEPLOY_REVISION
        - cat apps/agent/DEPLOY_REVISION
      addToRunPrepare:
        - requirements-agent.txt
      deployFiles:
        - apps/agent/main.py
        - apps/agent/src
        - apps/agent/skills
        - apps/agent/DEPLOY_REVISION
    run:
      base: python@3.12
      os: ubuntu
      prepareCommands:
        # uv creates the environment without requiring stdlib ensurepip.
        - python3 -m pip install --user uv
        - python3 -m uv venv --python python3 --no-python-downloads /home/zerops/oiui-venv
        - python3 -m uv pip install --python /home/zerops/oiui-venv/bin/python --no-cache -r requirements-agent.txt
      envVariables:
        PROVIDER_KEYS_MODE: server
        LLM_PROVIDER: openai
        OPENAI_BASE_URL: https://ninerouter-7xil.onrender.com/v1
        LLM_MODEL: ag/gemini-3.8-flash-low
        JEV_API_URL: https://ninerouter-7xil.onrender.com/v1/systemone
        JEV_MODEL: oc/jev-1.13-free
      start: >-
        sh -c 'cd /var/www/apps/agent &&
        exec /home/zerops/oiui-venv/bin/python -m uvicorn
        main:app --host 0.0.0.0 --port 8123 --workers 1'
      ports:
        - port: 8123
          httpSupport: true
      healthCheck:
        httpGet:
          port: 8123
          path: /health

  # Public Next.js website. Set OIUI_AUTH_PASSWORD as a Zerops secret.
  - setup: web
    build:
      base: nodejs@22
      os: ubuntu
      buildCommands:
        # Keep install and build in one shell so the user-local PATH persists.
        - |
          set -eu
          npm install --global --prefix "$HOME/.local" pnpm@9.0.0
          export PATH="$HOME/.local/bin:$PATH"
          pnpm install --frozen-lockfile
          pnpm exec turbo run build --filter=@repo/app
          mkdir -p release
          cp -a apps/app/.next/standalone/. release/
          mkdir -p release/apps/app/.next
          cp -a apps/app/.next/static release/apps/app/.next/static
          cp -a apps/app/public release/apps/app/public
      deployFiles:
        - release
    run:
      base: nodejs@22
      os: ubuntu
      envVariables:
        PROVIDER_KEYS_MODE: server
        OIUI_AUTH_USERNAME: admin
        NODE_ENV: production
        PORT: "3000"
        LANGGRAPH_DEPLOYMENT_URL: http://uiagent:8123
        RATE_LIMIT_ENABLED: "true"
        RATE_LIMIT_WINDOW_MS: "60000"
        RATE_LIMIT_MAX: "20"
        DO_NOT_TRACK: "1"
        NEXT_TELEMETRY_DISABLED: "1"
      # HOSTNAME is reserved as a Zerops service variable; override only for this process.
      start: env HOSTNAME=0.0.0.0 node /var/www/release/apps/app/server.js
      ports:
        - port: 3000
          httpSupport: true
      healthCheck:
        httpGet:
          port: 3000
          path: /api/health
