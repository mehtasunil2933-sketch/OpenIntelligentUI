#yamlPreprocessor=on
# NEW PROJECT IMPORT: copy this file into Zerops > Import a project.
# Before clicking Import, replace BOTH API-key placeholders below in the
# Zerops import editor ONLY. Never commit real keys to this public repository.
# Values are the raw keys, without a Bearer prefix or extra quotes in the value.
# The answer key and Jev key can be different; use the key accepted by each endpoint.
#
# Choose your region in the GUI and leave ZCP off for the trial.
# Uses the current repository zerops.yaml; do not replace it with an old exported
# zeropsYaml block, which would override the repository's deployment settings.
# buildFromGit is a one-time initial build, NOT an automatic GitHub push connection.
# Configure each service's Git CI/CD separately if you want subsequent pushes to deploy.
#
# After import, find the generated OIUI_AUTH_PASSWORD under web > Environment variables.
# Open web's HTTPS subdomain and log in as admin with that password.
# Agent checkpoints are in memory and do not survive restarts/redeployments.
# This creates a new project. Do not paste the whole file to update an existing project.
project:
  name: openintelligentui
  corePackage: LIGHT

services:
  - hostname: uiagent
    type: python@3.12
    priority: 10
    buildFromGit: https://github.com/mehtasunil2933-sketch/OpenIntelligentUI
    zeropsSetup: uiagent
    # Private backend: do not enable public subdomain access here.
    envSecrets:
      OPENAI_API_KEY: REPLACE_WITH_CHAT_ROUTER_API_KEY
      TYPESAFE_API_KEY: REPLACE_WITH_JEV_ROUTER_API_KEY
    # Public provider URLs, model IDs and server mode come from zerops.yaml:
    # OPENAI_BASE_URL=https://ninerouter-7xil.onrender.com/v1
    # LLM_MODEL=openai-compatible-chat-27098f25-205c-4a7a-aee6-f84faca99c43/zai-org/GLM-5.3-Flash
    # JEV_API_URL=https://ninerouter-7xil.onrender.com/v1/systemone
    # JEV_MODEL=oc/jev-1.13-free
    minContainers: 1
    maxContainers: 1
    verticalAutoscaling:
      minRam: 0.5
      maxRam: 2
      minFreeRamGB: 0.25
      minCpu: 1
      maxCpu: 2
      minDisk: 5

  - hostname: web
    type: nodejs@22
    priority: 5
    buildFromGit: https://github.com/mehtasunil2933-sketch/OpenIntelligentUI
    zeropsSetup: web
    enableSubdomainAccess: true
    envSecrets:
      # Generated by Zerops during import. This is a website password, not an API key.
      OIUI_AUTH_PASSWORD: <@generateRandomString(<32>)>
    # OIUI_AUTH_USERNAME=admin and private backend URL come from zerops.yaml.
    # Do NOT put OPENAI_API_KEY or TYPESAFE_API_KEY on this service.
    minContainers: 1
    maxContainers: 1
    verticalAutoscaling:
      minRam: 0.5
      maxRam: 2
      minFreeRamGB: 0.25
      minCpu: 1
      maxCpu: 2
      minDisk: 5
